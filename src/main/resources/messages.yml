# ==========================================
#  CustomMilestone 訊息檔
#  支援 & 色碼與 &#RRGGBB 十六進位色碼；%變數% 會自動替換
#  缺少的項目會在啟動與 /cm reload 時自動補齊
# ==========================================

prefix: "&8[&6CustomMilestone&8] &r"
no-permission: "&c你沒有權限這麼做。"

mode:
  vanilla: "原版成就"
  fallback: "降級模式"

frame:
  task: "&a進度"
  goal: "&b目標"
  challenge: "&5挑戰"

vanilla:
  story: "Minecraft（主線）"
  nether: "地獄"
  end: "終界"
  adventure: "冒險"
  husbandry: "農牧"

# 降級模式（伺服器不支援註冊原版成就時）的達成廣播，格式比照原版
announce:
  task: "&f%player% 已達成進度 %title%"
  goal: "&f%player% 已達成目標 %title%"
  challenge: "&f%player% 已完成挑戰 %title%"
  title-task: "&a[%name%&a]"
  title-goal: "&a[%name%&a]"
  title-challenge: "&5[%name%&5]"
  screen-title:
    task: "&a進度達成！"
    goal: "&b目標達成！"
    challenge: "&5挑戰完成！"

reward:
  to-pending: "&e背包已滿，&f%count% &e份獎勵已存入「待領取獎勵」，輸入 &f/cm &e到選單裡領取。"
  dropped: "&c待領取獎勵已達上限，&f%count% &c份獎勵掉落在你腳邊！"
  pending-reminder: "&e你有 &f%count% &e份待領取的成就獎勵，輸入 &f/cm &e領取。"
  claimed: "&a已領取獎勵。"
  claimed-all: "&a已領取 &f%count% &a份獎勵。"
  claimed-some: "&e已領取 &f%count% &e份獎勵，背包空間不足，其餘的請清出空間後再領取。"
  no-space: "&c背包空間不足，請先清出空間。"
  broken: "&c這份獎勵的資料已損毀，已從清單移除。"

input:
  hint: "&7請在聊天室輸入（最多 %max% 字），輸入 &f%keyword% &7取消，&f%seconds% &7秒後逾時。"
  timeout: "&c輸入逾時，已取消。"
  cancelled: "&7已取消輸入。"
  invalid-length: "&c內容不能是空白，且最多 %max% 字，請重新輸入。"

update:
  current: "&7目前版本：&f%current%"
  checking: "&7正在檢查 GitHub 上的最新版本..."
  latest: "&a已是最新版本（%current%）。"
  outdated: "&e有新版本！目前 &f%current% &e→ 最新 &f%latest%&e，下載：&f%url%"
  dev: "&b目前版本（%current%）比 GitHub 上的 %latest% 新（開發版）。"
  no-release: "&7GitHub 上還沒有發布任何版本。"
  failed: "&c無法檢查更新（連線失敗或達到 GitHub 查詢上限），請稍後再試。"
  join-notify: "&eCustomMilestone 有新版本 &f%latest%&e（目前 %current%）：&f%url%"

command:
  unknown: "&c未知的子指令，輸入 &f/%label% help &c查看說明。"
  player-only: "&c這個指令只能由玩家使用。"
  data-loading: "&e資料讀取中，請稍後再試。"
  player-not-found: "&c找不到玩家 &f%player%&c（需要曾經進過伺服器）。"
  milestone-not-found: "&c找不到成就 &f%id%&c。"
  bad-number: "&c數字格式錯誤：&f%value%"
  already-done: "&e%player% 已經完成 %name%&e。"
  not-done: "&e%player% 尚未完成 %name%&e，也沒有進度。"
  granted: "&a已給予 %player% 成就 %name%&a。"
  revoked: "&a已撤銷 %player% 的成就 %name%&a。"
  progress-set: "&a%player% 的 %name% &a進度：&f%current%/%target%"
  reset-one: "&a已重置 %player% 的成就 %name%&a。"
  reset-all: "&a已重置 %player% 的所有成就進度與完成紀錄（待領取獎勵與登入統計保留）。"
  reloaded: "&a重新載入完成：&f%categories% &a個分類、&f%milestones% &a個成就，顯示模式：&f%mode%"
  usage:
    view: "&c用法：/%label% view <玩家>"
    grant: "&c用法：/%label% grant <玩家> <成就ID>"
    revoke: "&c用法：/%label% revoke <玩家> <成就ID>"
    progress: "&c用法：/%label% progress <玩家> <成就ID> <add|set> <數量>"
    reset: "&c用法：/%label% reset <玩家> [成就ID]"
  help:
    - "&6===== CustomMilestone 指令 ====="
    - "&f/%label% &7- 開啟成就選單"
    - "&f/%label% top &7- 排行榜"
    - "&f/%label% view <玩家> &7- 查看其他玩家的成就"
    - "&f/%label% edit &7- 遊戲內編輯器"
    - "&f/%label% grant <玩家> <成就> &7- 給予成就"
    - "&f/%label% revoke <玩家> <成就> &7- 撤銷成就"
    - "&f/%label% progress <玩家> <成就> <add|set> <數量> &7- 調整進度"
    - "&f/%label% reset <玩家> [成就] &7- 重置成就資料"
    - "&f/%label% reload &7- 重新載入設定與成就"
    - "&f/%label% version &7- 檢查更新"

editor:
  saved: "&a已儲存。"
  deleted: "&a已刪除。"
  warning: "&e注意：%message%"
