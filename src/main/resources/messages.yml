# ==========================================
#  CustomMilestone 訊息檔
#  支援 & 色碼與 &#RRGGBB 十六進位色碼；%變數% 會自動替換
#  缺少的項目會在啟動與 /cm reload 時自動補齊
# ==========================================

prefix: "&8[&6CustomMilestone&8] &r"
no-permission: "&c你沒有權限這麼做。"

mode:
  vanilla: "原版成就"
  fallback: "降級模式"

frame:
  task: "&a進度"
  goal: "&b目標"
  challenge: "&5挑戰"

vanilla:
  story: "Minecraft（主線）"
  nether: "地獄"
  end: "終界"
  adventure: "冒險"
  husbandry: "農牧"

# 降級模式（伺服器不支援註冊原版成就時）的達成廣播，格式比照原版
announce:
  task: "&f%player% 已達成進度 %title%"
  goal: "&f%player% 已達成目標 %title%"
  challenge: "&f%player% 已完成挑戰 %title%"
  title-task: "&a[%name%&a]"
  title-goal: "&a[%name%&a]"
  title-challenge: "&5[%name%&5]"
  screen-title:
    task: "&a進度達成！"
    goal: "&b目標達成！"
    challenge: "&5挑戰完成！"

reward:
  to-pending: "&e背包已滿，&f%count% &e份獎勵已存入「待領取獎勵」，輸入 &f/cm &e到選單裡領取。"
  dropped: "&c待領取獎勵已達上限，&f%count% &c份獎勵掉落在你腳邊！"
