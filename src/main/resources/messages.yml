  prompt:
    category-id: "&e請輸入新分類的 ID（小寫英數與底線，1~32 字，也是檔名）："
    category-name: "&e請輸入分類的顯示名稱（可用 & 色碼）："
    milestone-id: "&e請輸入新成就的 ID（小寫英數與底線，1~32 字，全部分類不可重複）："
    name: "&e請輸入新的名稱（可用 & 色碼）："
    description: "&e請輸入說明，用 &f| &e分行（最多 8 行）："
    order: "&e請輸入排序數字（越小越前面）："
    targets: "&e請輸入目標，用逗號分隔（例如 &fdiamond_ore, deepslate_diamond_ore&e；標籤用 &f#minecraft:logs&e；輸入 &fany &e代表不限）："
    amount: "&e請輸入目標數量（正整數）："
    requires: "&e請輸入前置成就 ID，用逗號分隔（輸入 &fnone &e清除）："
    command: "&e請輸入獎勵指令（以後台身分執行，不用加 /，可用 &f%player% %uuid% %milestone%&e）："
    exp: "&e請輸入獎勵經驗值（0 ~ 1000000）："
  error:
    bad-id: "&cID 只能用小寫英數與底線（1~32 字），且不能叫 root，請重新輸入。"
    category-exists: "&c這個分類 ID 已存在，請重新輸入。"
    milestone-exists: "&c這個成就 ID 已存在，請重新輸入。"
    too-many: "&c已達數量上限。"
    description: "&c說明不能是空白，且最多 8 行，請重新輸入。"
    number: "&c數字格式錯誤或超出範圍，請重新輸入。"
    command: "&c指令不能是空白，請重新輸入。"
    unknown-milestone: "&c找不到其中一個成就 ID（也不能填自己），請重新輸入。"
    cycle: "&e部分前置成就會造成循環依賴，已自動略過。"
    empty-hand: "&c請把物品拿在主手上。"
    item-too-large: "&c這個物品的資料太大（例如裝滿東西的界伏盒），無法設為獎勵。"

